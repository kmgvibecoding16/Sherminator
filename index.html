<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Офисный SIMS: дожить до пятницы</title>
<style>
:root{
  --bg:#F4EFE6; --floor:#E3D5C0; --wall:#BFD7EA; --accent:#FF7A59;
  --success:#5CC48A; --warn:#F5B83D; --danger:#E5534B; --text:#2B2B3A; --stroke:#2B2B3A;
  --panel:#FFFFFF;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;overflow:hidden;font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--text);background:var(--bg);}
button{font-family:inherit;}
#app{position:absolute;inset:0;}
.screen{position:absolute;inset:0;display:none;overflow:auto;}
.screen.active{display:flex;flex-direction:column;}
.hidden{display:none !important;}

/* ---------- generic ---------- */
.btn{border:2px solid var(--stroke);border-radius:10px;background:var(--panel);cursor:pointer;font-weight:600;padding:8px 14px;color:var(--text);}
.btn:hover:not(:disabled){transform:translateY(-1px);}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
.btn.primary{background:var(--accent);color:#fff;}
.btn.ghost{background:transparent;}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid var(--stroke);cursor:pointer;padding:0;}
.swatch.selected{outline:3px solid var(--accent);outline-offset:2px;}
.chip{border:2px solid var(--stroke);border-radius:10px;background:var(--panel);padding:6px 10px;cursor:pointer;font-size:13px;}
.chip.selected{background:var(--accent);color:#fff;}
.chip:disabled{opacity:.35;cursor:not-allowed;}

/* ---------- character select ---------- */
#screen-select{align-items:center;justify-content:flex-start;padding:24px;gap:16px;}
.select-title{font-size:28px;font-weight:800;margin:8px 0;}
.char-grid{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;max-width:960px;}
.char-card{width:200px;border:2px solid var(--stroke);border-radius:16px;background:var(--panel);padding:12px;text-align:center;position:relative;}
.char-card.last{box-shadow:0 0 0 3px var(--accent);}
.char-card svg{width:100px;height:130px;}
.char-card h3{margin:4px 0 0;}
.char-card .pos{font-size:12px;opacity:.7;margin-bottom:4px;}
.char-card .status{font-size:11px;background:var(--wall);border-radius:6px;padding:3px 6px;margin:6px 0;}
.char-card .row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px;}
.char-card .titles{font-size:16px;margin-top:4px;}
.new-char-card{display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--accent);}

/* ---------- creator ---------- */
#screen-creator{padding:16px;gap:16px;}
.creator-wrap{display:flex;gap:24px;flex:1;max-width:1100px;margin:0 auto;width:100%;}
.creator-preview{flex:0 0 260px;display:flex;flex-direction:column;align-items:center;gap:8px;}
.creator-preview svg{width:200px;height:260px;}
.creator-form{flex:1;display:flex;flex-direction:column;gap:12px;overflow:auto;padding-right:8px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-weight:700;font-size:13px;}
.field input[type=text]{border:2px solid var(--stroke);border-radius:8px;padding:8px;font-size:14px;}
.field select{border:2px solid var(--stroke);border-radius:8px;padding:8px;font-size:14px;}
.swatch-row{display:flex;gap:8px;flex-wrap:wrap;}
.trait-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
.trait-card{border:2px solid var(--stroke);border-radius:10px;padding:8px;cursor:pointer;background:var(--panel);font-size:12px;}
.trait-card.selected{background:#FFE3D8;border-color:var(--accent);}
.trait-card:disabled{opacity:.35;cursor:not-allowed;}
.trait-card b{display:block;font-size:13px;}
.creator-actions{display:flex;gap:10px;justify-content:center;padding:8px 0;}

/* ---------- game screen ---------- */
#screen-game{height:100%;}
.game-grid{display:grid;grid-template-rows:72px 1fr 88px;grid-template-columns:1fr 300px;height:100%;gap:8px;padding:8px;}
.game-header{grid-column:1/3;display:flex;align-items:center;gap:14px;background:var(--panel);border:2px solid var(--stroke);border-radius:14px;padding:6px 14px;position:relative;}
.hdr-portrait{width:48px;height:62px;flex:0 0 auto;}
.hdr-portrait svg{width:100%;height:100%;}
.hdr-name{font-weight:800;font-size:14px;line-height:1.1;}
.hdr-pos{font-size:11px;opacity:.7;}
.hdr-day{font-weight:800;font-size:15px;text-align:center;}
.hdr-time{font-size:13px;opacity:.8;text-align:center;}
.hdr-dots{display:flex;gap:3px;justify-content:center;}
.hdr-dots span{width:7px;height:7px;border-radius:50%;background:var(--wall);border:1px solid var(--stroke);}
.hdr-dots span.done{background:var(--accent);}
.hdr-dots span.today{background:var(--text);}
.stats-row{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap;}
.stat{display:flex;align-items:center;gap:4px;font-size:12px;position:relative;}
.stat-bar{width:56px;height:10px;border:2px solid var(--stroke);border-radius:6px;overflow:hidden;background:#fff;}
.stat-fill{height:100%;transition:width .35s ease;}
.stat-num{width:22px;text-align:left;font-weight:700;}
.popup-delta{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-weight:800;font-size:12px;pointer-events:none;animation:popUp 1s ease-out forwards;}
@keyframes popUp{0%{opacity:1;transform:translate(-50%,0);}100%{opacity:0;transform:translate(-50%,-22px);}}
.buffs-row{display:flex;gap:6px;position:absolute;bottom:-18px;left:14px;font-size:11px;}
.buff-tag{background:var(--wall);border:1px solid var(--stroke);border-radius:8px;padding:1px 6px;}
.menu-btn{border:2px solid var(--stroke);border-radius:10px;background:var(--panel);width:36px;height:36px;font-size:18px;cursor:pointer;}

.office-wrap{background:var(--panel);border:2px solid var(--stroke);border-radius:14px;overflow:hidden;position:relative;}
.office-wrap svg{width:100%;height:100%;display:block;}
.player-group{transition:transform .6s ease;}
.player-group.anim-bob{animation:bob .5s ease-in-out infinite alternate;}
@keyframes bob{from{transform:translateY(0);}to{transform:translateY(-3px);}}
.colleague-group{animation:colbob 2.4s ease-in-out infinite;}
.colleague-group:nth-child(2n){animation-duration:3.1s;}
@keyframes colbob{0%,100%{transform:translateY(0);}50%{transform:translateY(-2px);}}
.speech-bubble{position:absolute;background:#fff;border:2px solid var(--stroke);border-radius:10px;padding:4px 8px;font-size:11px;max-width:160px;transform:translate(-50%,-100%);animation:bubbleIn .25s ease-out;z-index:5;}
@keyframes bubbleIn{from{opacity:0;transform:translate(-50%,-90%) scale(.8);}to{opacity:1;transform:translate(-50%,-100%) scale(1);}}

.sidebar{display:flex;flex-direction:column;gap:8px;overflow:hidden;}
.panel{background:var(--panel);border:2px solid var(--stroke);border-radius:14px;padding:8px;overflow:hidden;display:flex;flex-direction:column;}
.panel h4{margin:0 0 6px;font-size:13px;}
.tasks-panel{flex:0 0 auto;max-height:36%;overflow:auto;}
.task-item{font-size:12px;display:flex;gap:6px;align-items:center;padding:3px 0;border-bottom:1px dashed #ddd;}
.task-item.overdue{color:var(--danger);}
.task-item.done{opacity:.5;text-decoration:line-through;}
.log-panel{flex:1;overflow:hidden;}
.log-list{overflow:auto;flex:1;display:flex;flex-direction:column-reverse;}
.log-item{font-size:11px;padding:3px 0;border-bottom:1px dashed #eee;animation:slideIn .3s ease-out;}
@keyframes slideIn{from{opacity:0;transform:translateX(12px);}to{opacity:1;transform:translateX(0);}}

.actions-bar{grid-column:1/3;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--panel);border:2px solid var(--stroke);border-radius:14px;padding:6px;}
.action-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:2px solid var(--stroke);border-radius:10px;background:#fff;cursor:pointer;padding:4px;font-size:11px;position:relative;}
.action-btn .ic{font-size:18px;}
.action-btn .cost{font-size:9px;opacity:.6;}
.action-btn:disabled{opacity:.4;cursor:not-allowed;}
.action-btn.highlight{animation:pulse 1.2s ease-in-out infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,122,89,.6);}50%{box-shadow:0 0 0 6px rgba(255,122,89,0);}}

/* ---------- modal ---------- */
#modal-root{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5);z-index:50;padding:16px;}
#modal-root.open{display:flex;}
.modal-box{background:var(--panel);border:2px solid var(--stroke);border-radius:16px;padding:20px;max-width:480px;width:100%;max-height:90vh;overflow:auto;animation:popIn .25s ease-out;}
@keyframes popIn{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:scale(1);}}
.modal-box h2{margin-top:0;}
.modal-options{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.modal-options .btn{text-align:left;}
.hint{float:right;opacity:.7;font-size:12px;}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;}
.disclaimer{font-size:10px;opacity:.6;margin-top:10px;}
.confetti{position:fixed;top:-10px;width:8px;height:8px;z-index:60;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.3;}}
#toast{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:var(--danger);color:#fff;padding:8px 14px;border-radius:8px;font-size:12px;z-index:70;}

/* ---------- responsive ---------- */
@media (max-width:1023px){
  .game-grid{grid-template-columns:1fr 240px;}
}
@media (max-width:767px){
  html,body{overflow:auto;}
  .screen.active{overflow:auto;}
  #screen-game{height:auto;min-height:100%;}
  .game-grid{display:flex;flex-direction:column;height:auto;min-height:100%;padding:6px;gap:6px;}
  .game-header{flex-wrap:wrap;}
  .stats-row{display:grid;grid-template-columns:1fr 1fr;width:100%;margin-left:0;}
  .office-wrap{height:40vh;order:2;}
  .sidebar{order:3;}
  .tasks-panel{max-height:120px;}
  .log-panel{max-height:140px;}
  .actions-bar{order:4;grid-auto-flow:row;grid-template-columns:repeat(4,1fr);position:sticky;bottom:0;}
  .action-btn{min-height:44px;}
  .creator-wrap{flex-direction:column;}
  .creator-preview{position:sticky;top:0;background:var(--bg);z-index:2;}
  .modal-options .btn{width:100%;}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important;}
}
</style>
</head>
<body>
<div id="app">
  <div class="screen" id="screen-select"></div>
  <div class="screen" id="screen-creator"></div>
  <div class="screen" id="screen-game"></div>
</div>
<div id="modal-root" role="dialog" aria-modal="true"></div>
<div id="toast" class="hidden"></div>
<script>
'use strict';
/* ====================== UTIL ====================== */
function rand(){ return Math.random(); }
function randInt(min,max){ return Math.floor(rand()*(max-min+1))+min; }
function pick(arr){ return arr[Math.floor(rand()*arr.length)]; }
function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }
function pad2(n){ return n<10?'0'+n:''+n; }
function fmtTime(minutes){ const m=((minutes%1440)+1440)%1440; return pad2(Math.floor(m/60))+':'+pad2(m%60); }
function uid(prefix){ return prefix+'_'+Date.now()+'_'+Math.floor(rand()*100000); }
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ====================== STORAGE ====================== */
const LS_KEYS={characters:'officeSims.v1.characters', saves:'officeSims.v1.saves', settings:'officeSims.v1.settings'};
let storageOk=true;
function loadJSON(key,fallback){
  try{ const raw=localStorage.getItem(key); if(!raw) return fallback; return JSON.parse(raw); }
  catch(e){ console.error('load failed',key,e); return fallback; }
}
function saveJSON(key,value){
  try{ localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch(e){ console.error('save failed',key,e); storageOk=false; showToast('Сохранение недоступно в этом браузере — прогресс не будет сохранён.'); return false; }
}
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.remove('hidden'); setTimeout(()=>t.classList.add('hidden'), 4000); }

/* ====================== DATA ====================== */
const POSITIONS=['Менеджер','Разработчик','Дизайнер','Бухгалтер','HR-специалист','Аналитик','Стажёр','Маркетолог'];
const NAME_POOL=['Валера','Ксюша','Аркаша','Марина','Толик','Даша','Жора','Лиза','Денис','Оля','Стас','Настя','Паша','Катя','Вова','Юля','Сеня','Вика','Гриша','Инна','Костя','Лена'];
const SKIN_TONES=['#FFE0C2','#F6C9A0','#E0A878','#C68863','#9C6646','#6B4430'];
const HAIR_STYLES=[['short','Короткая'],['spiky','Ёжик'],['bob','Каре'],['ponytail','Хвостик'],['curly','Кудри'],['bald','Лысина с достоинством']];
const HAIR_COLORS=['#2B2B3A','#6B4226','#C1502E','#E8C170','#B9B9C2','#F4A6C6'];
const OUTFITS=[['shirt','Рубашка с галстуком'],['hoodie','Худи'],['suit','Деловой костюм'],['sweater','Свитер с оленями'],['tshirt','Футболка с мемом'],['dress','Платье-футляр']];

const ACCESSORIES=[['none','Нет'],['glasses','Очки'],['headphones','Наушники'],['badge','Бейдж на шнурке'],['mug','Кружка в руке']];

const TRAITS=[
 {id:'coffeeLover', icon:'☕', name:'Кофеман', desc:'Кофе даёт +30⚡ и 5 чашек без штрафа. Без кофе до 11:00 — −10😊', incompatible:[]},
 {id:'socialite', icon:'🎉', name:'Душа компании', desc:'«Поболтать» +25😊/+5⭐, без штрафа за 3-ю болтовню', incompatible:['introvert']},

 {id:'careerist', icon:'📈', name:'Карьерист', desc:'Совещания +15⭐; лучшие исходы с начальством; «Поболтать» −3😊', incompatible:[]},
 {id:'gourmet', icon:'🍕', name:'Гурман', desc:'Обед −80🍔/+15😊; голод растёт быстрее (+8/ч)', incompatible:[]},
 {id:'earlyBird', icon:'🌅', name:'Жаворонок', desc:'До 12:00 −30% энергозатрат, после 18:00 +30%; ночью +5⚡', incompatible:['nightOwl']},
 {id:'nightOwl', icon:'🦉', name:'Сова', desc:'До 11:00 +30% энергозатрат, после 15:00 −30%; переработка бодрит', incompatible:['earlyBird']},

];
function traitById(id){ return TRAITS.find(t=>t.id===id); }

const TASKS_GENERIC=[
 'Переименовать final_final_v3_точно.docx','Согласовать согласование','Свести таблицу, которую никто не откроет',

 'Обновить KPI по обновлению KPI','Заполнить отчёт о заполнении отчётов','Перенести встречу, которую уже дважды переносили',

const TASKS_BY_POSITION={

 'Разработчик':['Починить баг, который на самом деле фича','Отрефакторить код, который все боятся трогать','Написать тест для кода без тестов'],
 'Дизайнер':['Сделать логотип «покрупнее»','Выбрать между 50 оттенками белого','Переделать макет в седьмой раз'],
 'Бухгалтер':['Найти потерянные 3 копейки','Свести баланс, который не сходится','Объяснить, почему цифры не бьются'],
 'HR-специалист':['Организовать тимбилдинг, которого никто не хочет','Разослать опрос вовлечённости','Придумать ценность компании номер семь'],
 'Аналитик':['Построить дашборд, который никто не откроет','Найти инсайт в данных без данных','Пересчитать метрику в третий раз'],
 'Стажёр':['Разобраться, что такое «синхронизация»','Принести всем кофе и запомнить заказы','Найти, где лежит регламент регламентов'],
 'Маркетолог':['Придумать слоган короче названия компании','Запустить рекламу про отмену рекламы','Согласовать пост с десятью людьми']
};
function taskPoolFor(position){ return TASKS_GENERIC.concat(TASKS_BY_POSITION[position]||[]); }

const CHAT_LINES=[
 'Ты видел новую рассылку? Я тоже не читал.','Говорят, в пятницу дадут пиццу. Говорят это с 2019 года.',
 'Я так устал, что моргаю по расписанию.','Мой кот работает больше меня — спит 20 часов, и никто не спрашивает KPI.',

];

function defaultLook(){
 return {skin:0, hair:'short', hairColor:0, outfit:'shirt', outfitColor:0, accessory:'none'};
}
function newDraft(){
 return {id:null, name:'', position:POSITIONS[0], customPosition:'', look:defaultLook(), traits:[]};
}
function randomDraft(){
 const traitsShuffled=TRAITS.slice().sort(()=>rand()-0.5);
 let chosen=[];
 for(const t of traitsShuffled){
   if(chosen.length>=2) break;
   if(chosen.some(c=>t.incompatible.includes(c.id)||c.incompatible.includes(t.id))) continue;
   chosen.push(t);
 }
 return {
  id:null, name:pick(NAME_POOL), position:pick(POSITIONS), customPosition:'',
  look:{skin:randInt(0,5), hair:HAIR_STYLES[randInt(0,5)][0], hairColor:randInt(0,5), outfit:OUTFITS[randInt(0,5)][0], outfitColor:randInt(0,5), accessory:ACCESSORIES[randInt(0,4)][0]},
  traits: chosen.map(t=>t.id)
 };
}
function draftToCharacter(draft, existing){
 const position = draft.position==='Своя…'? (draft.customPosition||'Сотрудник') : draft.position;
 return {
  id: existing? existing.id : uid('c'),
  name: draft.name.trim(),
  position,
  look: Object.assign({}, draft.look),
  traits: draft.traits.slice(0,2),
  bestTitle: existing? existing.bestTitle : null,
  titles: existing? existing.titles.slice() : [],
  weeksPlayed: existing? existing.weeksPlayed : 0,
  createdAt: existing? existing.createdAt : Date.now()
 };
}

function generateTasksForDay(position, dayIndex, countOverride){
 const counts=[2,3,3,3,2];
 const count = countOverride!=null?countOverride:counts[dayIndex];
 const pool = taskPoolFor(position).slice().sort(()=>rand()-0.5);
 const list=[];
 for(let i=0;i<count;i++){
   const title = pool[i%pool.length];
   list.push({id:uid('t'), title, size:randInt(1,3), progress:0, day:dayIndex, overdue:false, completed:false});
 }
 return list;
}

function newGameState(character){
 const tasks = generateTasksForDay(character.position, 0);
 return {
  version:1, characterId:character.id, day:0, minutes:540,
  stats:{energy:80, mood:70, hunger:20, reputation:50},
  buffs:[],
  tasks: tasks,
  dailyCounters:{coffee:0, meetings:0, chats:0, lunch:false, events:0},
  weekCounters:{coffee:0, meetings:0, chats:0, beers:0, overtimeMin:0, events:0, tasksDone:0, tasksTotal:tasks.length},

  _leftBefore1830:false, _fainted:false

}

function statColor(value, invert){
 const v = invert? 100-value : value;
 return v>60?'var(--success)': v>=30?'var(--warn)':'var(--danger)';
}
function round1(fx){ const o={}; for(const k in fx){ o[k]=Math.round(fx[k]); } return o; }

function applyEffects(state, character, fx, atMinutes){
 const traits=getTraitSet(character);
 const f=Object.assign({}, fx);
 const hungryAngry = state.stats.hunger>=80;
 if(f.energy && f.energy<0){
  let mult=1;
  if(traits.has('earlyBird')){ if(atMinutes<720) mult*=0.7; else if(atMinutes>=1080) mult*=1.3; }
  if(traits.has('nightOwl')){ if(atMinutes<660) mult*=1.3; else if(atMinutes>=900) mult*=0.7; }
  if(hungryAngry) mult*=1.5;
  f.energy = f.energy*mult;
 }
 if(hungryAngry){ f.mood = (f.mood||0)-5; }
 if(f.reputation && traits.has('anxious')){ f.reputation = f.reputation*1.5; }
 return round1(f);
}

function mutateStats(state, fx, container){
 const deltas={};
 ['energy','mood','hunger','reputation'].forEach(k=>{
  if(fx[k]){
   const before=state.stats[k];
   let after=before+fx[k];
   after=clamp(after,0,100);
   state.stats[k]=after;
   const real=after-before;
   if(real!==0){ deltas[k]=real; if(container) spawnPopup(k, real); }
  }
 });
 return deltas;
}

function addLog(state, icon, text, fx){
 const parts=[];
 if(fx){
  const map={energy:'⚡',mood:'😊',hunger:'🍔',reputation:'⭐'};
  for(const k in map){ if(fx[k]){ parts.push(map[k]+(fx[k]>0?'+':'')+fx[k]); } }
 }
 state.log.unshift({t:state.minutes, icon, text, fxText:parts.join(' '), score: fx?Object.values(fx).reduce((a,b)=>a+Math.abs(b||0),0):0});
 if(state.log.length>30) state.log.length=30;
}

function advanceTime(state, character, minutesDelta){
 const traits=getTraitSet(character);
 const oldMinutes=state.minutes;
 state.minutes += minutesDelta;
 const hours = minutesDelta/60;
 const hungerRate = traits.has('gourmet')?8:6;
 state.stats.hunger = clamp(state.stats.hunger + hungerRate*hours, 0, 100);
 state.stats.energy = clamp(state.stats.energy - 2*hours, 0, 100);
 for(let i=state.buffs.length-1;i>=0;i--){
  const b=state.buffs[i];
  if(b.until!=null && oldMinutes<b.until && state.minutes>=b.until){
   if(b.id==='caffeine'){ state.stats.energy=clamp(state.stats.energy-10,0,100); addLog(state,'☕','Кофеиновый откат догнал тебя.',{energy:-10}); }
   state.buffs.splice(i,1);
  }
 }
 if(traits.has('coffeeLover') && !state.flags.coffeePenaltyApplied && state.dailyCounters.coffee===0 && oldMinutes<660 && state.minutes>=660){
  state.stats.mood=clamp(state.stats.mood-10,0,100);
  state.flags.coffeePenaltyApplied=true;
  addLog(state,'☕','Кофемана трясёт без кофе.',{mood:-10});
 }
 if(state.stats.hunger>=100 && state.phase==='playing' && !state._fainted){
  state._fainted=true;
  state.minutes+=120;
  state.stats.reputation=clamp(state.stats.reputation-10,0,100);
  state.stats.hunger=70;
  addLog(state,'😵','Обморок у кулера. Коллеги накапали тебе воды, кто-то сфотографировал.',{reputation:-10});
 } else { state._fainted=false; }
}

function hasOpenTasks(state){ return state.tasks.some(t=>!t.completed); }
function firstOpenTask(state){ return state.tasks.find(t=>!t.completed); }
function addProgress(state, character, amount){
 const t=firstOpenTask(state);
 if(!t) return;
 let amt=amount;
 if(state.stats.mood<20) amt*=0.5;
 t.progress += amt;
 if(t.progress>=t.size){
  t.completed=true;
  state.weekCounters.tasksDone++;
  const traits=getTraitSet(character);
  let repFx={reputation:5};
  if(traits.has('anxious')) repFx={reputation:5, mood:5};
  const applied=applyEffects(state, character, repFx, state.minutes);
  mutateStats(state, applied, true);
  addLog(state,'✅',`Поручение выполнено: «${t.title}»`, applied);
 }
}
function addNewTask(character, state, sizeOverride){
 const pool=taskPoolFor(character.position);
 const title=pick(pool);
 const t={id:uid('t'), title, size:sizeOverride||randInt(1,3), progress:0, day:state.day, overdue:false, completed:false};
 state.tasks.push(t);
 state.weekCounters.tasksTotal++;
 return t;
}

function computeActionAvailability(state, character){
 const traits=getTraitSet(character);
 const m=state.minutes;
 const res={};
 const canFinishBy21=(dur)=> m+dur<=1260;
 res.work={enabled:true, reason:''};
 if(state.stats.mood<=0 && hasOpenTasks(state)){ res.work={enabled:false, reason:'Настроение на нуле. Сначала приди в себя.'}; }
 else if(!canFinishBy21(60)){ res.work={enabled:false, reason:'Не успеть до конца дня.'}; }
 res.meeting={enabled:true, reason:''};
 if(m>=1080){ res.meeting={enabled:false, reason:'Совещания только с 09:00 до 18:00.'}; }
 else if(!canFinishBy21(60)){ res.meeting={enabled:false, reason:'Не успеть до конца дня.'}; }
 res.coffee={enabled:true, reason:''};
 if(state.flags.coffeeBroken){ res.coffee={enabled:false, reason:'Кофемашина сломана до конца дня.'}; }
 else if(!canFinishBy21(15)){ res.coffee={enabled:false, reason:'Не успеть до конца дня.'}; }
 res.lunch={enabled:true, reason:''};
 if(state.dailyCounters.lunch){ res.lunch={enabled:false, reason:'Обед уже был сегодня.'}; }
 else if(m<720 || m>=900){ res.lunch={enabled:false, reason:'Обед только с 12:00 до 15:00.'}; }
 res.chat={enabled:true, reason:''};
 if(!canFinishBy21(30)){ res.chat={enabled:false, reason:'Не успеть до конца дня.'}; }
 res.home={enabled:true, reason:''};
 res.beer={enabled:true, reason:''};
 if(m<1080 && state.stats.energy>0){ res.beer={enabled:false, reason:'Доступно после 18:00 (или когда кончатся силы).'}; }
 return res;
}

function performWork(state, character){
 const traits=getTraitSet(character);
 const overtime = state.minutes>=1080;
 const noTasks = !hasOpenTasks(state);
 let base, duration=60, progress=1, extraLog='';
 if(noTasks){
  base={energy:-5, mood:5, hunger:0, reputation:0};
 } else {
  base={energy: traits.has('introvert')?-10:-15, mood:-3, hunger:4, reputation:0};
  if(overtime){
   base.reputation+=3;
   if(traits.has('workaholic')){ /* no penalty */ }
   else if(traits.has('nightOwl')){ base.mood+=5; }
   else { base.mood-=5; }
   state.weekCounters.overtimeMin+=60;
   state.flags.workedLate = state.flags.workedLate || state.minutes>=1200;
  }
  if(traits.has('workaholic') && rand()<0.25){ progress=2; }
  else if(traits.has('procrastinator')){
   if(state.minutes>=1020 && state.minutes<1080){ progress=2; }
   else if(rand()<0.25){ progress=0; base.mood=(base.mood||0)+10; extraLog=' Посмотрел одно видео… и ещё одно.'; }
  }
 }
 if(state.flags.sugarCrash){ duration+=30; state.flags.sugarCrash=false; extraLog+=' Сахарная кома замедлила процесс.'; }
 const applied=applyEffects(state, character, base, state.minutes);
 advanceTime(state, character, duration);
 const deltas=mutateStats(state, applied, true);
 addLog(state, '💻', (noTasks?'Сделал вид, что работаешь.':'Поработал за столом.')+extraLog, deltas);
 if(!noTasks) addProgress(state, character, progress);
 return true;
}
function performMeeting(state, character){
 const traits=getTraitSet(character);
 const tier=state.dailyCounters.meetings;
 let moodPenalty = tier===0?-10: tier===1?-15:-20;
 if(traits.has('introvert')) moodPenalty-=5;
 let repGain = tier>=2?5:10;
 if(traits.has('careerist')) repGain+=5;
 let duration=60;
 let extra='';
 if(rand()<0.2){ duration+=30; extra=' Совещание затянулось.'; }
 const base={energy:-5, mood:moodPenalty, hunger:3, reputation:repGain};
 const applied=applyEffects(state, character, base, state.minutes);
 advanceTime(state, character, duration);
 const deltas=mutateStats(state, applied, true);
 state.dailyCounters.meetings++; state.weekCounters.meetings++;
 addLog(state,'👥','Совещание в переговорной.'+extra, deltas);
 return true;
}
function performCoffee(state, character){
 const traits=getTraitSet(character);
 const freeLimit = traits.has('coffeeLover')?5:3;
 const idx=state.dailyCounters.coffee;
 let energyGain, moodFx, note='';
 if(idx<freeLimit){ energyGain = traits.has('coffeeLover')?30:20; moodFx=3; }
 else { energyGain=10; moodFx=-10; note=' Руки трясутся.'; }
 if(state.flags.hangover && !state.flags.hangoverHalfCoffeeUsed){ energyGain=Math.round(energyGain/2); state.flags.hangoverHalfCoffeeUsed=true; note+=' Кофе еле спасает после вчерашнего.'; }
 const base={energy:energyGain, mood:moodFx, hunger:1, reputation:0};
 const applied=applyEffects(state, character, base, state.minutes);
 advanceTime(state, character, 15);
 const deltas=mutateStats(state, applied, true);
 state.dailyCounters.coffee++; state.weekCounters.coffee++;
 state.buffs=state.buffs.filter(b=>b.id!=='caffeine');
 state.buffs.push({id:'caffeine', until: state.minutes+120});
 addLog(state,'☕','Кофе. Жизнь налаживается.'+note, deltas);
 return true;
}
function performLunch(state, character){
 const traits=getTraitSet(character);
 const base = traits.has('gourmet')? {energy:5, mood:15, hunger:-80, reputation:0} : {energy:5, mood:8, hunger:-60, reputation:0};
 const applied=applyEffects(state, character, base, state.minutes);
 advanceTime(state, character, 60);
 const deltas=mutateStats(state, applied, true);
 state.dailyCounters.lunch=true;
 addLog(state,'🍲','Обед на кухне.', deltas);
 return true;
}
function performChat(state, character){
 const traits=getTraitSet(character);
 const idx=state.dailyCounters.chats;
 let moodFx=15, repFx=2;
 if(traits.has('socialite')){ moodFx=25; repFx=5; }
 else if(traits.has('introvert')){ moodFx=5; }
 if(traits.has('careerist')) moodFx-=3;
 if(idx>=2 && !traits.has('socialite')) repFx-=5;
 const base={energy:-3, mood:moodFx, hunger:2, reputation:repFx};
 const applied=applyEffects(state, character, base, state.minutes);
 advanceTime(state, character, 30);
 const deltas=mutateStats(state, applied, true);
 state.dailyCounters.chats++; state.weekCounters.chats++;
 const colleague=pick(NPCS).name;
 const line=pick(CHAT_LINES);
 spawnBubble(line);
 addLog(state,'💬',`Поболтал с коллегой (${colleague}): «${line}»`, deltas);
 return true;
}

function startBossEventIfNeeded(state){
 if(state.stats.reputation>0) return false;
 if(state.flags.bossWarnings===0){
  state.flags.bossWarnings=1;
  openEventModal(BOSS_EVENT, true);
  return true;
 } else {
  state.phase='fired';
  saveCurrent();
  openWeekResults(true);
  return true;
 }
}

function postActionChecks(state, character){
 if(state.stats.energy<=0 && state.phase==='playing'){
  if(state.minutes<1020){
   const applied=applyEffects(state, character, {reputation:-5}, state.minutes);
   mutateStats(state, applied, true);
   addLog(state,'🥴','Ушёл, держась за стенку.', applied);
  }
  openEnergyOutModal();
  return;
 }
 if(state.minutes>=1260 && state.phase==='playing'){
  addLog(state,'🔒','Охранник выключил свет.', null);
  finishDay(state, character, 'forced');
  return;
 }
 if(state.stats.reputation<=0 && state.phase==='playing'){
  if(startBossEventIfNeeded(state)) return;
 }
 maybeTriggerEvent(state, character);
 saveCurrent();
 updateGameUI();
}

function maybeTriggerEvent(state, character){
 if(state.phase!=='playing') return;
 if(state.dailyCounters.events>=3) return;
 if(!state.flags.urgentEventDone && state.day===state.weekEventDay && state.minutes>=1050 && state.minutes<1260){
  state.flags.urgentEventDone=true;
  state.minutes = Math.min(state.minutes, 1079);
  state.dailyCounters.events++; state.weekCounters.events++;
  openEventModal(EVENTS[0], false);
  return;
 }
 const traits=getTraitSet(character);
 const luckBonus = traits.has('lucky')?0.2:0;
 if(rand()<0.3){
  let candidates=EVENTS.slice(1).filter(e=> !e.condition || e.condition(state));
  let fresh=candidates.filter(e=>!state.seenEvents.includes(e.id));
  let pool = fresh.length? fresh : candidates;
  if(pool.length===0) return;
  const ev=pick(pool);
  if(!state.seenEvents.includes(ev.id)) state.seenEvents.push(ev.id);
  state.dailyCounters.events++; state.weekCounters.events++;
  openEventModal(ev, false, luckBonus);
 }
}

function resolveEventOption(ev, optIndex, character, state, luckBonus){
 const opt=ev.options[optIndex];
 let fx=Object.assign({}, opt.fx||{});
 let texts=[opt.text].filter(Boolean);
 let flags=Object.assign({}, opt.flags||{});
 let addTask=opt.addTask||false;
 let addTaskDone=opt.addTaskDone||null;
 let progressAdd=opt.progress||0;
 let setRepRange=opt.setReputation||null;
 if(opt.outcomes && opt.outcomes.length){
  let roll=rand();
  if(luckBonus){ roll=Math.max(0, roll-luckBonus); }
  let cum=0, chosen=opt.outcomes[opt.outcomes.length-1];
  for(const o of opt.outcomes){ cum+=o.chance; if(roll<cum){ chosen=o; break; } }
  if(chosen.fx) for(const k in chosen.fx){ fx[k]=(fx[k]||0)+chosen.fx[k]; }
  if(chosen.text) texts.push(chosen.text);
  if(chosen.flags) Object.assign(flags, chosen.flags);
  if(chosen.addTask) addTask=true;
 }
 if(flags.coffeeBroken) state.flags.coffeeBroken=true;
 if(flags.sugarCrash) state.flags.sugarCrash=true;
 if(flags.lunchUsed) state.dailyCounters.lunch=true;
 const applied=applyEffects(state, character, fx, state.minutes);
 const deltas=mutateStats(state, applied, true);
 if(setRepRange){ state.stats.reputation = randInt(setRepRange[0], setRepRange[1]); }
 if(progressAdd) addProgress(state, character, progressAdd);
 if(addTask) addNewTask(character, state);
 if(addTaskDone){
  const t={id:uid('t'), title:addTaskDone.title, size:addTaskDone.size||1, progress:addTaskDone.size||1, day:state.day, overdue:false, completed:true};
  state.tasks.push(t); state.weekCounters.tasksTotal++; state.weekCounters.tasksDone++;
 }
 addLog(state, '📌', ev.title+': '+texts.join(' '), deltas);
 state.highlight = pickHighlight(state, ev.title+': '+texts.join(' '), deltas);
 return {texts, deltas};
}
function pickHighlight(state, text, deltas){
 const score = deltas? Object.values(deltas).reduce((a,b)=>a+Math.abs(b),0) : 0;
 if(!state.highlight || score>=state.highlight.score){ return {text, score}; }
 return state.highlight;
}

function finishDay(state, character, mode){
 state.flags.dayEndMode = mode;
 if(state.day===4){ state.phase='weekEnd'; saveCurrent(); openWeekResults(false); }
 else { state.phase='dayEnd'; saveCurrent(); openDaySummary(); }
}
function goHomeToSleep(state, character, mode){
 const traits=getTraitSet(character);
 if(traits.has('workaholic') && state.minutes<1140){
  state.stats.mood=clamp(state.stats.mood-5,0,100);
  addLog(state,'😣','Муки совести по дороге домой.', {mood:-5});
 }
 state._leftBefore1830 = state.minutes<1110;
 finishDay(state, character, mode||'home');
}
function performHome(state, character, confirmed){
 if(state.minutes<1080 && !confirmed){ return 'needConfirm'; }
 if(state.minutes<1080 && confirmed){
  const applied=applyEffects(state, character, {reputation:-15}, state.minutes);
  mutateStats(state, applied, true);
  addLog(state,'🏠','Ушёл пораньше. Аркадий Борисович всё видел.', applied);
 }
 goHomeToSleep(state, character, 'home');
 return 'done';
}
function performBeerChoice(state, character, choiceIdx){
 const traits=getTraitSet(character);
 const opts=[
  {mood:10, label:'Одну и домой'},
  {mood:20, label:'Ну, по второй'},
  {mood:30, label:'Ещё по одной… и ещё…'}
 ];
 const c=opts[choiceIdx];
 const applied=applyEffects(state, character, {mood:c.mood}, state.minutes);
 mutateStats(state, applied, true);
 state.weekCounters.beers++;
 let hangover=false;
 if(choiceIdx===2){
  hangover = !(traits.has('ironLiver') && rand()<0.5);
  state.flags.hangover = hangover;
 }
 addLog(state,'🍺', c.label+(hangover?' Завтра будет тяжело.':''), applied);
 finishDay(state, character, 'beer');
}

function nextDay(state, character){
 const traits=getTraitSet(character);
 const oldDay=state.day;
 state.tasks.forEach(t=>{
  if(!t.completed && t.day===oldDay){
   t.overdue=true; t.day=oldDay+1;
   const applied=applyEffects(state, character, {reputation:-5}, state.minutes);
   mutateStats(state, applied, false);
   addLog(state,'🔥',`Поручение просрочено: «${t.title}»`, applied);
  }
 });
 const newDay=oldDay+1;
 state.day=newDay;
 const newTasks=generateTasksForDay(character.position, newDay);
 state.tasks = state.tasks.concat(newTasks);
 state.weekCounters.tasksTotal += newTasks.length;

 let energy=75;
 if(state.flags.dayEndMode==='home' && state._leftBefore1830) energy+=10;
 if(state.flags.workedLate) energy-=10;
 if(state.flags.hangover) energy-=25;
 if(traits.has('earlyBird')) energy+=5;
 energy=clamp(energy,0,100);
 state.stats.energy=energy;
 state.stats.hunger=25;
 let mood=Math.min(90, state.stats.mood+10);
 if(newDay===4) mood=Math.min(100, mood+15);
 state.stats.mood=clamp(mood,0,100);

 let startMinutes=540;
 if(state.flags.hangover){
  startMinutes=570;
  const applied=applyEffects(state, character, {reputation:-5}, startMinutes);
  mutateStats(state, applied, false);
  addLog(state,'🥴','Опоздал после вчерашнего.', applied);
 }
 state.minutes=startMinutes;
 state.flags.hangover=false;
 state.flags.coffeeBroken=false;
 state.flags.coffeePenaltyApplied=false;
 state.flags.hangoverHalfCoffeeUsed=false;
 state.flags.workedLate=false;
 state.flags.sugarCrash=false;
 state._leftBefore1830=false;
 state.dailyCounters={coffee:0, meetings:0, chats:0, lunch:false, events:0};
 state.buffs=[];
 state.phase='playing';
 addLog(state,'🌅', MORNING_GREETS[newDay]||'Новый день.', null);
 saveCurrent();
}

function computeTitle(state){
 if(state.phase==='fired') return TITLES.freeSpirit;
 const wc=state.weekCounters;
 const pct = wc.tasksTotal? wc.tasksDone/wc.tasksTotal : 0;
 if(pct>=0.85 && state.stats.reputation>=70) return TITLES.legend;
 if((wc.tasksTotal>0 && wc.tasksDone>=wc.tasksTotal) || wc.overtimeMin>=360) return TITLES.responsible;
 if(wc.coffee>=12) return TITLES.coffeeSurvivor;
 if(wc.meetings>=8) return TITLES.meetingMaster;
 if(wc.beers>=4 || wc.chats>=10) return TITLES.partySoul;
 return TITLES.quietSurvivor;
}

 const scaleX=rect.width/vb.width, scaleY=rect.height/vb.height;
 const tf=player.style.transform||'';
 const m=tf.match(/translate\(([-\d.]+)px,([-\d.]+)px\)/);
 const x = m? parseFloat(m[1])*scaleX : rect.width/2;
 const y = m? parseFloat(m[2])*scaleY : rect.height/2;
 bubble.style.left=x+'px';
 bubble.style.top=(y-40)+'px';
 wrap.appendChild(bubble);
 setTimeout(()=>bubble.remove(), 2600);
}
function spawnConfettiBurst(count){
 const colors=['var(--accent)','var(--success)','var(--warn)','var(--danger)','#5C7CFA'];
 for(let i=0;i<(count||40);i++){
  const d=document.createElement('div');
  d.className='confetti';
  d.style.left=rand()*100+'vw';
  d.style.background=pick(colors);
  d.style.animationDuration=(1+rand())+'s';
  document.body.appendChild(d);
  setTimeout(()=>d.remove(), 2200);
 }
}

/* ====================== MODALS ====================== */
function modalRoot(){ return document.getElementById('modal-root'); }
function setModalHtml(html){ const r=modalRoot(); r.innerHTML=html; r.classList.add('open'); App.modalEpoch=(App.modalEpoch||0)+1; return App.modalEpoch; }
function closeModalRoot(){ const r=modalRoot(); r.classList.remove('open'); r.innerHTML=''; App.modal=null; App.modalEpoch=(App.modalEpoch||0)+1; }

function fxHint(opt){
 if(opt.outcomes && opt.outcomes.length) return '🎲';
 const map={energy:'⚡',mood:'😊',hunger:'🍔',reputation:'⭐',time:'⏱'};
 const parts=[];
 for(const k in (opt.fx||{})){ if(opt.fx[k]) parts.push(map[k]+(opt.fx[k]>0?'+':'')+opt.fx[k]); }
 return parts.join(' ')||'';
}
function openEventModal(ev, isBoss, luckBonus){
 App.modal={type:'event', ev, isBoss, luckBonus};
 setModalHtml(`<div class="modal-box">
  <h2>${escapeHtml(ev.title)}</h2>
  <p>${escapeHtml(ev.text)}</p>
  <div class="modal-options">
   ${ev.options.map((o,i)=>`<button class="btn" data-act="event-choice" data-value="${i}">${escapeHtml(o.label)} <span class="hint">${fxHint(o)}</span></button>`).join('')}
  </div>
 </div>`);
}
function handleEventChoice(idx){
 const {ev, isBoss, luckBonus}=App.modal;
 const character=getCharacter(App.currentCharacterId);
 const state=getGame(character.id);
 const result=resolveEventOption(ev, idx, character, state, luckBonus||0);
 saveCurrent();
 const epoch=setModalHtml(`<div class="modal-box">
  <h2>Что было дальше</h2>
  <p>${escapeHtml(result.texts.join(' '))}</p>
  <div class="modal-footer"><button class="btn primary" data-act="event-ack">Ясно</button></div>
 </div>`);
 App.modal={type:'event-ack', afterBoss:isBoss};
 setTimeout(()=>{ if(App.modal && App.modal.type==='event-ack' && App.modalEpoch===epoch) closeAfterEvent(); }, 3500);
}
function closeAfterEvent(){
 const wasBoss = App.modal && App.modal.afterBoss;
 closeModalRoot();
 updateGameUI();
 if(wasBoss){
  const state=getGame(App.currentCharacterId);
  postActionChecks(state, getCharacter(App.currentCharacterId));
 }
}

/* ====================== SCREEN SWITCHING ====================== */
function setScreen(name){
 App.screen=name;
 ['screen-select','screen-creator','screen-game'].forEach(id=>{
  document.getElementById(id).classList.toggle('active', id==='screen-'+name);
 });
}
function goToSelect(){ setScreen('select'); renderSelect(); }
function goToCreatorNew(){
 App.creatorDraft=newDraft(); App.creatorEditingId=null;
 setScreen('creator'); renderCreator();
}
function goToCreatorEdit(charId){
 const c=getCharacter(charId);
 App.creatorDraft={id:c.id, name:c.name, position:POSITIONS.includes(c.position)?c.position:'Своя…', customPosition:POSITIONS.includes(c.position)?'':c.position, look:Object.assign({},c.look), traits:c.traits.slice()};
 App.creatorEditingId=charId;
 setScreen('creator'); renderCreator();
}
function goToGame(charId, isNewCharacter){
 App.currentCharacterId=charId;
 App.settings.lastCharacterId=charId; persistSettings();
 let state=getGame(charId);
 const character=getCharacter(charId);
 if(!state || state.phase==='weekEnd' || state.phase==='fired'){
  if(!state){ state=newGameState(character); setGame(charId,state); }
 }
 setScreen('game'); renderGame();
 if(isNewCharacter) openHowTo();
}

/* ====================== ACTION DISPATCH ====================== */
function doAction(actionId){
 const character=getCharacter(App.currentCharacterId);
 const state=getGame(character.id);
 if(!state || state.phase!=='playing') return;
 const avail=computeActionAvailability(state, character);
 if(avail[actionId] && !avail[actionId].enabled) return;
 state._lastAction=actionId;
 state.firstActionDone=true;
 let needConfirm=false;
 switch(actionId){
  case 'work': performWork(state, character); break;
  case 'meeting': performMeeting(state, character); break;
  case 'coffee': performCoffee(state, character); break;
  case 'lunch': performLunch(state, character); break;
  case 'chat': performChat(state, character); break;
  case 'home': {
   const r=performHome(state, character, false);
   if(r==='needConfirm'){ needConfirm=true; }
   break;
  }
  case 'beer': {
   if(state.minutes<1080 && state.stats.energy>0) return;
   openBarModal();
   return;
  }
 }
 if(needConfirm){
  openConfirm('Уйти пораньше? Аркадий Борисович всё видит (−15 ⭐)', ()=>{
   performHome(state, character, true);
   updateGameUI();
  });
  return;
 }
 if(state.phase==='playing'){
  postActionChecks(state, character);
 } else {
  updateGameUI();
 }
}

/* ====================== CLICK DELEGATION ====================== */
document.getElementById('app').addEventListener('click', onAppClick);
document.getElementById('modal-root').addEventListener('click', onAppClick);
function onAppClick(e){
 const btn=e.target.closest('[data-act]');
 if(!btn) return;
 const act=btn.getAttribute('data-act');
 const value=btn.getAttribute('data-value');
 switch(act){
  case 'select-char': goToGame(value, false); break;
  case 'new-char': if(App.characters.length<6) goToCreatorNew(); break;
  case 'edit-char': goToCreatorEdit(value); break;
  case 'delete-char': openConfirm('Удалить этого сотрудника без возможности восстановления?', ()=>{
    App.characters=App.characters.filter(c=>c.id!==value);
    delete App.saves[value];
    persistCharacters(); persistSaves();
    closeModalRoot(); renderSelect();
   }); break;
  case 'random-name': App.creatorDraft.name=pick(NAME_POOL); renderCreator(); break;
  case 'randomize-char': { const id=App.creatorDraft.id; App.creatorDraft=randomDraft(); App.creatorDraft.id=id; renderCreator(); break; }
  case 'set-look': {
   const field=btn.getAttribute('data-field');
   const raw=btn.getAttribute('data-value');
   const stringFields=['hair','outfit','accessory'];
   App.creatorDraft.look[field] = stringFields.indexOf(field)>=0 ? raw : Number(raw);
   renderCreator();
   break;
  }
  case 'toggle-trait': {
   const d=App.creatorDraft;
   const idx=d.traits.indexOf(value);
   if(idx>=0){ d.traits.splice(idx,1); }
   else {
    const t=traitById(value);
    const blocked=d.traits.some(id=>traitById(id).incompatible.includes(value));
    if(d.traits.length<2 && !blocked) d.traits.push(value);
   }
   renderCreator();
   break;
  }
  case 'creator-submit': submitCreator(); break;
  case 'creator-cancel': goToSelect(); break;
  case 'do-action': doAction(value); break;
  case 'open-menu': openMenu(); break;
  case 'close-menu': closeModalRoot(); break;
  case 'menu-switch-char': closeModalRoot(); goToSelect(); break;
  case 'menu-restart-week': openConfirm('Начать неделю заново? Весь прогресс текущей недели будет потерян.', ()=>{
    restartWeek(getCharacter(App.currentCharacterId)); closeModalRoot(); renderGame();
   }); break;
  case 'menu-toggle-sound': App.settings.soundOn=!App.settings.soundOn; persistSettings(); openMenu(); break;
  case 'menu-howto': openHowTo(); break;
  case 'howto-close': closeModalRoot(); break;
  case 'confirm-yes': { const cb=App.pendingConfirm; App.pendingConfirm=null; closeModalRoot(); if(cb) cb(); break; }
  case 'confirm-no': App.pendingConfirm=null; closeModalRoot(); break;
  case 'event-choice': handleEventChoice(Number(value)); break;
  case 'event-ack': closeAfterEvent(); break;
  case 'energyout-bar': closeModalRoot(); openBarModal(); break;
  case 'energyout-home': {
   closeModalRoot();
   const character=getCharacter(App.currentCharacterId);
   const state=getGame(character.id);
   goHomeToSleep(state, character, 'energyHome');
   break;
  }
  case 'bar-choice': {
   closeModalRoot();
   const character=getCharacter(App.currentCharacterId);
   const state=getGame(character.id);
   performBeerChoice(state, character, Number(value));
   break;
  }
  case 'daysummary-sleep': {
   closeModalRoot();
   const character=getCharacter(App.currentCharacterId);
   const state=getGame(character.id);
   nextDay(state, character);
   renderGame();
   break;
  }
  case 'weekresults-newweek': {
   closeModalRoot();
   const character=getCharacter(App.currentCharacterId);
   restartWeek(character);
   renderGame();
   break;
  }
  case 'weekresults-switchchar': closeModalRoot(); goToSelect(); break;
 }
}

function submitCreator(){
 if(!creatorValid()) return;
 const existing = App.creatorEditingId? getCharacter(App.creatorEditingId) : null;
 const character = draftToCharacter(App.creatorDraft, existing);
 if(existing){
  Object.assign(existing, {name:character.name, position:character.position, look:character.look});
  persistCharacters();
  goToSelect();
 } else {
  App.characters.push(character);
  persistCharacters();
  const state=newGameState(character);
  setGame(character.id, state);
  goToGame(character.id, true);
 }
}

/* ====================== KEYBOARD ====================== */
document.addEventListener('keydown', e=>{
 if(App.modal && App.modal.type==='event'){
  const idx={'1':0,'2':1,'3':2,'a':0,'b':1,'c':2}[e.key.toLowerCase()];
  if(idx!=null){ handleEventChoice(idx); }
  return;
 }
 if(App.screen==='game' && !App.modal){
  const i=Number(e.key)-1;
  if(i>=0 && i<ACTION_DEFS.length){ doAction(ACTION_DEFS[i].id); }
  if(e.key==='Escape'){ /* menu toggle not open by default */ }
 }
 if(e.key==='Escape' && App.modal && App.modal.type==='menu'){ closeModalRoot(); }
});

/* ====================== INIT ====================== */
function init(){
 loadAll();
 if(App.characters.length===0){
  goToCreatorNew();
 } else {
  goToSelect();
 }
}
init();
